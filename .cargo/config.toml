# macOS link workaround for the ort-sys prebuilt onnxruntime
# (ms@1.31.0): its static archive references two CoreML ObjC classes
# that only exist in SDKs targeting newer macOS
# (_OBJC_CLASS_$_MLComputePlan, _OBJC_CLASS_$_MLOptimizationHints, both
# reachable only from the CoreML execution-provider factory). ObjC
# classes bind dynamically at runtime, so allowing them to be undefined
# at link time is the standard practice; the CPU execution provider
# this runtime uses never touches those paths. All other targets build
# with ort's defaults.
[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))']
rustflags = [
    "-C",
    "link-arg=-Wl,-U,_OBJC_CLASS_$_MLComputePlan",
    "-C",
    "link-arg=-Wl,-U,_OBJC_CLASS_$_MLOptimizationHints",
]
