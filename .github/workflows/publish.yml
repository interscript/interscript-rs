name: publish

# crates.io Trusted Publishing: the crate owner registers this repo +
# workflow filename on crates.io (Account settings -> Trusted Publishing),
# then a manual dispatch publishes with OIDC - no crates.io token.
on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Verify version
        run: cargo metadata --no-deps --format-version 1 | grep -o '"version":"0.2.0"'
      - name: Exchange OIDC for a short-lived crates.io token
        id: auth
        uses: rust-lang/crates-io-auth-action@v1
      - name: Publish to crates.io
        run: cargo publish --token ${{ steps.auth.outputs.token }}
